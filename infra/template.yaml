AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CareLoop: DynamoDB table, SNS family topic and the nightly Bedrock summary Lambda.
  The MCP server itself runs as a container (see Dockerfile and docs/DEPLOY.md).

Parameters:
  PersonName:
    Type: String
    Default: Amma
  FamilyEmail:
    Type: String
    Description: Email that receives daily summaries and urgent alerts
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  SummaryTimeUtc:
    Type: String
    Default: cron(30 15 * * ? *)   # 15:30 UTC = 9:00 PM IST
    Description: When to send the daily summary

Resources:
  CareTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  FamilyTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: CareLoop
      Subscription:
        - { Protocol: email, Endpoint: !Ref FamilyEmail }

  DailySummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: careloop.daily_job.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          CARELOOP_TABLE: !Ref CareTable
          CARELOOP_SNS_TOPIC_ARN: !Ref FamilyTopic
          CARELOOP_PERSON_NAME: !Ref PersonName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CareTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt FamilyTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource: "*"
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: !Ref SummaryTimeUtc

Outputs:
  TableName:
    Value: !Ref CareTable
  TopicArn:
    Value: !Ref FamilyTopic
