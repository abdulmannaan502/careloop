[project]
name = "careloop"
version = "1.0.0"
description = "Alexa+ MCP server that helps older adults manage medicines by voice and keeps family informed"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "uvicorn>=0.30",
    "boto3>=1.35",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
careloop = "careloop.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["careloop"]

[tool.pytest.ini_options]
pythonpath = ["."]
